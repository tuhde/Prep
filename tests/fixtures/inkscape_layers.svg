<?xml version="1.0" encoding="UTF-8"?>
<svg width="100mm" height="100mm" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <g inkscape:groupmode="layer" inkscape:label="Red Layer">
    <rect x="10" y="10" width="30" height="30" stroke="#ff0000" fill="none"/>
    <circle cx="25" cy="60" r="10" stroke="#ff0000" fill="none"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Blue Layer">
    <path d="M 50,10 L 90,10 L 90,50 L 50,50 Z" stroke="#0000ff" fill="none"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Hidden Layer" style="display:none">
    <rect x="10" y="70" width="20" height="20" stroke="#00ff00" fill="none"/>
  </g>
</svg>
